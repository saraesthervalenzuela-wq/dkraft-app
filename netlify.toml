[build]
  command = "npm install && npm run build"
  publish = "dist"

# Proxy API requests to backend
[[redirects]]
  from = "/api/*"
  to = "https://dkraft.com.mx/api/:splat"
  status = 200
  force = true

# SPA fallback - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
