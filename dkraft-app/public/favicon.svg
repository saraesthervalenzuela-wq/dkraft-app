<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0044cc"/>
      <stop offset="100%" style="stop-color:#0033b3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22"/>
      <stop offset="100%" style="stop-color:#d35400"/>
    </linearGradient>
  </defs>
  <!-- Base/Floor -->
  <rect x="40" y="400" width="432" height="72" rx="12" fill="url(#blueGrad)"/>
  <!-- Main Building -->
  <rect x="80" y="180" width="200" height="220" rx="8" fill="url(#blueGrad)"/>
  <!-- Chimney -->
  <rect x="220" y="80" width="40" height="100" rx="4" fill="url(#blueGrad)"/>
  <!-- Smoke circles -->
  <circle cx="240" cy="55" r="18" fill="url(#orangeGrad)" opacity="0.9"/>
  <circle cx="260" cy="35" r="14" fill="url(#orangeGrad)" opacity="0.7"/>
  <circle cx="275" cy="20" r="10" fill="url(#orangeGrad)" opacity="0.5"/>
  <!-- Windows -->
  <rect x="100" y="210" width="60" height="50" rx="4" fill="url(#orangeGrad)"/>
  <rect x="200" y="210" width="60" height="50" rx="4" fill="url(#orangeGrad)"/>
  <rect x="100" y="290" width="60" height="50" rx="4" fill="url(#orangeGrad)"/>
  <rect x="200" y="290" width="60" height="50" rx="4" fill="url(#orangeGrad)"/>
  <!-- Side Building -->
  <rect x="300" y="260" width="140" height="140" rx="8" fill="url(#blueGrad)"/>
  <!-- Gear icon on side building -->
  <circle cx="370" cy="330" r="45" fill="none" stroke="url(#orangeGrad)" stroke-width="12"/>
  <circle cx="370" cy="330" r="20" fill="url(#orangeGrad)"/>
  <!-- Gear teeth -->
  <rect x="360" y="275" width="20" height="15" rx="2" fill="url(#orangeGrad)"/>
  <rect x="360" y="370" width="20" height="15" rx="2" fill="url(#orangeGrad)"/>
  <rect x="315" y="320" width="15" height="20" rx="2" fill="url(#orangeGrad)"/>
  <rect x="410" y="320" width="15" height="20" rx="2" fill="url(#orangeGrad)"/>
  <!-- Door -->
  <rect x="145" y="350" width="70" height="50" rx="6" fill="url(#orangeGrad)"/>
</svg>
